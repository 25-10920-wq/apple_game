<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 사과 게임</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Jua&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', 'Jua', sans-serif;
      background: linear-gradient(135deg, #e8d5f5 0%, #d5e8f5 50%, #f5d5e8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      user-select: none;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #c06090;
      text-shadow: 2px 2px 0 #fff, 3px 3px 0 #f8b3d0;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    /* ── HUD ─────────────────────────────────── */
    #hud {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }

    .hud-card {
      background: #fff;
      border-radius: 18px;
      padding: 8px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #7a5080;
      box-shadow: 0 4px 12px rgba(180, 120, 200, 0.18);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #timer-val {
      font-size: 1.3rem;
      color: #e05090;
      font-weight: 900;
      min-width: 36px;
      text-align: center;
      transition: color 0.3s;
    }

    #timer-val.urgent {
      color: #ff2060;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.12);
      }
    }

    /* ── Buttons ───────────────────────────── */
    .btn {
      background: #FFB3C6;
      border: none;
      border-radius: 50px;
      padding: 9px 22px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: #7a3050;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 100, 150, 0.22);
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 6px 16px rgba(255, 100, 150, 0.32);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.mint {
      background: #B3F0E6;
      color: #1a6050;
      box-shadow: 0 4px 10px rgba(50, 200, 160, 0.22);
    }

    .btn.mint:hover {
      box-shadow: 0 6px 16px rgba(50, 200, 160, 0.35);
    }

    .btn.yellow {
      background: #FFF0B3;
      color: #806000;
      box-shadow: 0 4px 10px rgba(220, 180, 0, 0.18);
    }

    .btn.yellow:hover {
      box-shadow: 0 6px 16px rgba(220, 180, 0, 0.30);
    }

    .btn.purple {
      background: #d9b3f0;
      color: #400060;
      box-shadow: 0 4px 10px rgba(160, 80, 220, 0.22);
    }

    .btn.purple:hover {
      box-shadow: 0 6px 16px rgba(160, 80, 220, 0.32);
    }

    /* ── Board wrapper ─────────────────────── */
    #board-wrap {
      position: relative;
      display: inline-block;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(180, 120, 200, 0.18);
      backdrop-filter: blur(6px);
    }

    /* ── Grid ─────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(17, 46px);
      grid-template-rows: repeat(10, 46px);
      gap: 4px;
      position: relative;
    }

    /* ── Cell ─────────────────────────────── */
    .cell {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffe0ec, #ffd0e8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.18rem;
      font-weight: 900;
      color: #c02060;
      cursor: pointer;
      transition: background 0.15s, transform 0.12s, box-shadow 0.12s;
      box-shadow: 0 2px 6px rgba(200, 80, 120, 0.13);
      position: relative;
      overflow: hidden;
    }

    .cell:empty,
    .cell.empty {
      background: rgba(220, 200, 240, 0.18);
      box-shadow: none;
      cursor: default;
      pointer-events: none;
    }

    .cell .apple-emoji {
      width: 60%;
      height: 60%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell .apple-num {
      font-size: 0.88rem;
      font-weight: 900;
      line-height: 1;
      margin-top: -2px;
    }

    .cell.selected {
      background: linear-gradient(135deg, #ffb3c6, #ff90b0);
      transform: scale(1.08);
      box-shadow: 0 4px 14px rgba(255, 80, 130, 0.38);
      z-index: 2;
    }

    .cell.selected-sum-ok {
      background: linear-gradient(135deg, #b3f0d0, #7aecc0);
      transform: scale(1.1);
      box-shadow: 0 4px 16px rgba(50, 200, 140, 0.45);
      z-index: 3;
    }

    /* Pop animation */
    @keyframes pop {
      0% {
        transform: scale(1.1);
        opacity: 1;
      }

      40% {
        transform: scale(1.45);
        opacity: 0.8;
      }

      100% {
        transform: scale(0);
        opacity: 0;
      }
    }

    .cell.popping {
      animation: pop 0.38s ease-in forwards;
      pointer-events: none;
    }

    /* ── Drag selection overlay ──────────────── */
    #drag-box {
      position: absolute;
      border: 2.5px dashed #ff80b0;
      background: rgba(255, 180, 210, 0.22);
      border-radius: 8px;
      pointer-events: none;
      display: none;
      z-index: 10;
    }

    /* ── Floating score ─────────────────────── */
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      80% {
        opacity: 0.9;
        transform: translateY(-60px) scale(1.2);
      }

      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1);
      }
    }

    .float-score {
      position: fixed;
      font-family: 'Nunito', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: #ff4090;
      text-shadow: 0 2px 6px rgba(255, 80, 160, 0.4);
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 9999;
    }

    /* ── Modal backdrop ─────────────────────── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(80, 40, 120, 0.38);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-bg.show {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #fff;
      border-radius: 28px;
      padding: 36px 40px;
      max-width: 420px;
      width: 92%;
      box-shadow: 0 16px 56px rgba(150, 80, 200, 0.28);
      text-align: center;
      transform: translateY(24px) scale(0.95);
      transition: transform 0.28s;
    }

    .modal-bg.show .modal {
      transform: translateY(0) scale(1);
    }

    .modal h2 {
      font-size: 1.9rem;
      font-weight: 900;
      color: #b03070;
      margin-bottom: 8px;
    }

    .modal p {
      color: #7a5080;
      font-size: 1rem;
      margin-bottom: 14px;
    }

    .modal .big-score {
      font-size: 2.6rem;
      font-weight: 900;
      color: #ff4090;
      margin: 8px 0 16px;
    }

    .modal input[type="text"] {
      width: 100%;
      padding: 11px 18px;
      border: 2.5px solid #FFB3C6;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #7a3050;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }

    .modal input[type="text"]:focus {
      border-color: #ff80b0;
    }

    /* Ranking list */
    #rank-list {
      list-style: none;
      text-align: left;
      max-height: 320px;
      overflow-y: auto;
    }

    #rank-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 14px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #fff0f8, #f0f8ff);
      font-weight: 700;
      color: #7a3060;
      font-size: 0.97rem;
    }

    #rank-list li:nth-child(1) {
      background: linear-gradient(90deg, #ffe5b3, #fff8b3);
      color: #805000;
    }

    #rank-list li:nth-child(2) {
      background: linear-gradient(90deg, #e8e8e8, #f8f8f8);
      color: #555;
    }

    #rank-list li:nth-child(3) {
      background: linear-gradient(90deg, #f5dcc8, #fff0e0);
      color: #804020;
    }

    .rank-medal {
      font-size: 1.2rem;
      min-width: 28px;
      text-align: center;
    }

    .rank-name {
      flex: 1;
    }

    .rank-score {
      font-weight: 900;
      color: #e04090;
    }

    /* ── Sum indicator ─────────────────────── */
    #sum-indicator {
      font-size: 1.1rem;
      font-weight: 800;
      color: #b03070;
      min-width: 80px;
      text-align: center;
    }

    #sum-indicator.ok {
      color: #20a060;
    }

    /* ── Responsive ─────────────────────────── */
    @media (max-width: 900px) {
      #grid {
        grid-template-columns: repeat(17, 38px);
        grid-template-rows: repeat(10, 38px);
        gap: 3px;
      }

      .cell {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        font-size: 1rem;
      }

      .cell .apple-emoji {
        width: 55%;
        height: 55%;
      }

      .cell .apple-num {
        font-size: 0.75rem;
      }
    }

    @media (max-width: 700px) {
      #grid {
        grid-template-columns: repeat(17, 30px);
        grid-template-rows: repeat(10, 30px);
        gap: 2px;
      }

      .cell {
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }

      .cell .apple-emoji {
        width: 50%;
        height: 50%;
      }

      .cell .apple-num {
        font-size: 0.6rem;
      }

      h1 {
        font-size: 1.5rem;
      }
    }

    /* game over overlay on board */
    #game-over-board {
      position: absolute;
      inset: 0;
      background: rgba(255, 220, 240, 0.5);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 900;
      color: #c02060;
      z-index: 20;
      display: none;
      letter-spacing: 2px;
    }
  </style>
</head>

      <button class="btn mint" style="width:100%;margin-top:16px;" onclick="closeRanking()">✖ 닫기</button>

  <script>
    // ═══════════════════════════════════════════
    //  Constants
    // ═══════════════════════════════════════════
    const ROWS = 10, COLS = 17;
    const TOTAL_TIME = 120;

    // ═══════════════════════════════════════════
    //  State
    // ═══════════════════════════════════════════
    let board = [];          // 2D: number 1-9, or 0 (empty)
    let score = 0;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let paused = false;
    let gameEnded = false;

    // drag state
    let dragging = false;
    let dragStart = { r: -1, c: -1 };
    let dragEnd = { r: -1, c: -1 };

    // ═══════════════════════════════════════════
    //  DOM refs
    // ═══════════════════════════════════════════
    const gridEl = document.getElementById('grid');
    const dragBox = document.getElementById('drag-box');
    const timerVal = document.getElementById('timer-val');
    const scoreVal = document.getElementById('score-val');
    const sumIndicator = document.getElementById('sum-indicator');
    const pauseBtn = document.getElementById('pause-btn');
    const gameoverModal = document.getElementById('gameover-modal');
    const rankingModal = document.getElementById('ranking-modal');
    const finalScoreEl = document.getElementById('final-score');
    const rankList = document.getElementById('rank-list');
    const gameOverBoard = document.getElementById('game-over-board');

    // ═══════════════════════════════════════════
    //  Init
    // ═══════════════════════════════════════════
    function initBoard() {
      board = [];
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = Math.ceil(Math.random() * 9);
        }
      }
    }

    function buildGrid() {
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;
          updateCellDisplay(cell, board[r][c]);
          gridEl.appendChild(cell);
        }
      }
    }

    function updateCellDisplay(cell, val) {
      if (val === 0) {
        cell.innerHTML = '';
        cell.classList.add('empty');

    function getCell(r, c) {
      return gridEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    }

    // ═══════════════════════════════════════════
    //  Timer
    // ═══════════════════════════════════════════
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (paused || gameEnded) return;
        timeLeft--;
        timerVal.textContent = timeLeft;
        if (timeLeft <= 15) timerVal.classList.add('urgent');
        else timerVal.classList.remove('urgent');
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function togglePause() {
      if (gameEnded) return;
      paused = !paused;
      pauseBtn.textContent = paused ? '▶ 재개' : '⏸ 일시정지';
    }

    // ═══════════════════════════════════════════
    //  Score
    // ═══════════════════════════════════════════
    function calcBonus(count) {
      if (count === 2) return 10;
      if (count === 3) return 30;
      if (count === 4) return 60;
      if (count === 5) return 100;
      if (count >= 6) return 100 + (count - 5) * 50;
      return 0;
    }

    function addScore(pts, x, y) {
      score += pts;
      scoreVal.textContent = score;
      spawnFloatScore(pts, x, y);
    }

    function spawnFloatScore(pts, x, y) {
      const el = document.createElement('div');
      el.className = 'float-score';
      el.textContent = `+${pts}`;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    // ═══════════════════════════════════════════
    //  Drag
    // ═══════════════════════════════════════════
    function cellFromPoint(x, y) {
      // find cell element at position
      const els = document.elementsFromPoint(x, y);
      for (const el of els) {
        if (el.classList.contains('cell')) return el;
      }
      return null;
    }

    function rcFromCell(cell) {
      return { r: parseInt(cell.dataset.r), c: parseInt(cell.dataset.c) };
    }

    function getSelectionRect() {
      const r1 = Math.min(dragStart.r, dragEnd.r);
      const r2 = Math.max(dragStart.r, dragEnd.r);
      const c1 = Math.min(dragStart.c, dragEnd.c);
      const c2 = Math.max(dragStart.c, dragEnd.c);
      return { r1, r2, c1, c2 };
    }

    function getSelectedCells() {
      const { r1, r2, c1, c2 } = getSelectionRect();
      const cells = [];
      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          if (board[r][c] !== 0) cells.push({ r, c });
        }
      }
      return cells;
    }

    function getSelectionSum() {
      return getSelectedCells().reduce((s, { r, c }) => s + board[r][c], 0);
    }

    function highlightSelection() {
      // clear all
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
          const el = getCell(r, c);
          el.classList.remove('selected', 'selected-sum-ok');
        }

      if (!dragging) {
        sumIndicator.textContent = '-';
        sumIndicator.classList.remove('ok');
        return;
      }

      const cells = getSelectedCells();
      const sum = cells.reduce((s, { r, c }) => s + board[r][c], 0);
      const isOk = sum === 10;

      sumIndicator.textContent = sum;
      sumIndicator.classList.toggle('ok', isOk);

      for (const { r, c } of cells) {
        const el = getCell(r, c);
        el.classList.add(isOk ? 'selected-sum-ok' : 'selected');
      }
    }

    // Update drag-box visual
    function updateDragBox() {
      if (!dragging) { dragBox.style.display = 'none'; return; }

      const { r1, r2, c1, c2 } = getSelectionRect();
      const boardRect = gridEl.getBoundingClientRect();
      const wrapRect = gridEl.parentElement.getBoundingClientRect();

      const topLeft = getCell(r1, c1);
      const botRight = getCell(r2, c2);
      if (!topLeft || !botRight) return;

      const tlRect = topLeft.getBoundingClientRect();
      const brRect = botRight.getBoundingClientRect();

      const offsetX = wrapRect.left;
      const offsetY = wrapRect.top;

      dragBox.style.display = 'block';
      dragBox.style.left = `${tlRect.left - offsetX + gridEl.offsetLeft - 14}px`;
      dragBox.style.top = `${tlRect.top - offsetY + gridEl.offsetTop - 14}px`;
      dragBox.style.width = `${brRect.right - tlRect.left}px`;
      dragBox.style.height = `${brRect.bottom - tlRect.top}px`;
    }

    // ── Mouse events ────────────────────────────
    gridEl.addEventListener('mousedown', e => {
      if (gameEnded || paused) return;
      const cell = e.target.closest('.cell');
      if (!cell || cell.classList.contains('empty')) return;
      dragging = true;
      const rc = rcFromCell(cell);
      dragStart = dragEnd = rc;
      highlightSelection();
      updateDragBox();
      e.preventDefault();
    });

    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const cell = cellFromPoint(e.clientX, e.clientY);
      if (cell && !cell.classList.contains('empty')) {
        const rc = rcFromCell(cell);
        dragEnd = rc;
      }
      highlightSelection();
      updateDragBox();
    });

    window.addEventListener('mouseup', e => {
      if (!dragging) return;
      dragging = false;
      dragBox.style.display = 'none';

      const cells = getSelectedCells();
      const sum = cells.reduce((s, { r, c }) => s + board[r][c], 0);

      if (sum === 10 && cells.length >= 2) {
        removeApples(cells, e.clientX, e.clientY);
      } else {
        highlightSelection();
      }
    });

    // Touch support
    gridEl.addEventListener('touchstart', e => {
      if (gameEnded || paused) return;
      const t = e.touches[0];
      const cell = cellFromPoint(t.clientX, t.clientY);
      if (!cell || cell.classList.contains('empty')) return;
      dragging = true;
      const rc = rcFromCell(cell);
      dragStart = dragEnd = rc;
      highlightSelection();
      updateDragBox();
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (!dragging) return;
      const t = e.touches[0];
      const cell = cellFromPoint(t.clientX, t.clientY);
      if (cell && !cell.classList.contains('empty')) {
        dragEnd = rcFromCell(cell);
      }
      highlightSelection();
      updateDragBox();
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', e => {
      if (!dragging) return;
      dragging = false;
      dragBox.style.display = 'none';

      const cells = getSelectedCells();
      const sum = cells.reduce((s, { r, c }) => s + board[r][c], 0);

      const t = e.changedTouches[0];
      if (sum === 10 && cells.length >= 2) {
        removeApples(cells, t.clientX, t.clientY);
      } else {
        highlightSelection();
      }
    });

    // ═══════════════════════════════════════════
    //  Remove apples
    // ═══════════════════════════════════════════
    function removeApples(cells, mx, my) {
      // pop animation
      for (const { r, c } of cells) {
        const el = getCell(r, c);
        el.classList.remove('selected', 'selected-sum-ok');
        el.classList.add('popping');
      }

      const pts = calcBonus(cells.length);

      setTimeout(() => {
        for (const { r, c } of cells) {
          board[r][c] = 0;
          const el = getCell(r, c);
          el.classList.remove('popping');
          updateCellDisplay(el, 0);
        }
        addScore(pts, mx, my);
        highlightSelection();
      }, 380);
    }

    // ═══════════════════════════════════════════
    //  Game end / restart
    // ═══════════════════════════════════════════
    function endGame() {
      gameEnded = true;
      clearInterval(timerInterval);
      gameOverBoard.style.display = 'flex';
      setTimeout(() => {
        finalScoreEl.textContent = score;
        gameoverModal.classList.add('show');
      }, 700);
    }

    function restartGame() {
      gameEnded = false;
      paused = false;
      score = 0;
      timeLeft = TOTAL_TIME;
      pauseBtn.textContent = '⏸ 일시정지';
      timerVal.textContent = TOTAL_TIME;
      timerVal.classList.remove('urgent');
      scoreVal.textContent = '0';
      sumIndicator.textContent = '-';
      sumIndicator.classList.remove('ok');
      gameOverBoard.style.display = 'none';
      gameoverModal.classList.remove('show');
      rankingModal.classList.remove('show');
      initBoard();
      buildGrid();
      startTimer();
    }

    // ═══════════════════════════════════════════
    //  Ranking
    // ═══════════════════════════════════════════
    function loadRanking() {
      try { return JSON.parse(localStorage.getItem('apple_ranking') || '[]'); }
      catch { return []; }
    }

    function saveScore() {
      const name = document.getElementById('nickname-input').value.trim() || '익명';
      const ranking = loadRanking();
      ranking.push({ name, score, date: new Date().toLocaleDateString('ko-KR') });
      ranking.sort((a, b) => b.score - a.score);
      if (ranking.length > 10) ranking.length = 10;
      localStorage.setItem('apple_ranking', JSON.stringify(ranking));
      gameoverModal.classList.remove('show');
      showRanking();
    }

    function showRanking() {
      const ranking = loadRanking();
      const medals = ['🥇', '🥈', '🥉'];
      rankList.innerHTML = ranking.length === 0
        ? '<li style="justify-content:center;color:#aaa;">아직 기록이 없어요 😢</li>'
        : ranking.map((entry, i) => `
        <li>
          <span class="rank-medal">${medals[i] || `#${i + 1}`}</span>
          <span class="rank-name">${entry.name}</span>
          <span class="rank-score">${entry.score.toLocaleString()}점</span>
          <span style="color:#bbb;font-size:0.8rem;margin-left:4px;">${entry.date || ''}</span>
        </li>`).join('');
      rankingModal.classList.add('show');
    }

    function closeRanking() { rankingModal.classList.remove('show'); }

    // Close modals on backdrop click
    [gameoverModal, rankingModal].forEach(m => {
      m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
    });

    // ═══════════════════════════════════════════
    //  Start
    // ═══════════════════════════════════════════
    initBoard();
    buildGrid();
    startTimer();
  </script>
</body>

</html>
